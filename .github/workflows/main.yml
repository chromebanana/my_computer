name: Build My Computer

on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  check:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Cache Homebrew
       # caching downloads only -- caching the cellar proved to much of a headache
        id: cache-brew
        uses: actions/cache@v4
        env:
          cache-name: cache-homebrew
        with:
          path: |
            /Users/runner/Library/Caches/Homebrew
          key: ${{ runner.os }}-${{ env.cache-name }}
          restore-keys: |
              ${{ runner.os }}-${{ env.cache-name }}-

      - name: Run install script
        env:
          NONINTERACTIVE: 1
        run: |
          ./install.sh